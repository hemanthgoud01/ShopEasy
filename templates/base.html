{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>ShopEasy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">ShopEasy</a>

            <div class="ms-auto">
                {% if user.is_staff %}
                <a href="{% url 'dashboard' %}" class="btn btn-info btn-sm">
                    Dashboard
                </a>
                {% endif %}

                {% if user.is_authenticated %}

                <a href="{% url 'wishlist' %}" class="btn btn-outline-light btn-sm">
                    ❤️ Wishlist
                </a>

                <a href="{% url 'cart' %}" class="btn btn-warning btn-sm">
                    Cart
                </a>


                <a href="{% url 'profile' %}" class="btn btn-light btn-sm">
                    Profile
                </a>

                <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
                    Logout
                </a>




                {% else %}



                <a href="{% url 'login' %}" class="btn btn-success btn-sm">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-primary btn-sm">
                    Register
                </a>

                {% endif %}

            </div>

        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="{% static 'js/main.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
