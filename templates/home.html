{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Latest Products</h2>

<div class="row">

    {% for product in products %}

    <div class="col-md-4 mb-4">

        <div class="card">

            <img src="{{ product.image.url }}" class="card-img-top" style="height:250px;object-fit:cover;">

            <div class="card-body">

                <h5>{{ product.name }}</h5>

                <p>₹{{ product.price }}</p>

                <a href="{% url 'product_detail' product.id %}" class="btn btn-primary">
                    View
                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
