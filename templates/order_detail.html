{% extends 'base.html' %}

{% block content %}

<h2>Order #{{ order.id }}</h2>

<p>Status: {{ order.status }}</p>

<p>Total: ₹{{ order.total_amount }}</p>

<h4>Products</h4>

<ul>

    {% for item in order.items.all %}

    <li>

        {{ item.product.name }}

        ×

        {{ item.quantity }}

        =

        ₹{{ item.subtotal }}

    </li>

    {% endfor %}

</ul>

{% endblock %}
