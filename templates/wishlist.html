{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">❤️ My Wishlist</h2>

{% if items %}

<div class="row">

    {% for item in items %}

    <div class="col-md-4 mb-4">

        <div class="card h-100 shadow-sm">

            <img src="{{ item.product.image.url }}" class="card-img-top" style="height:250px;object-fit:cover;">

            <div class="card-body">

                <h5>{{ item.product.name }}</h5>

                <p class="text-success fw-bold">
                    ₹{{ item.product.price }}
                </p>

                <a href="{% url 'product_detail' item.product.id %}" class="btn btn-primary btn-sm">
                    View
                </a>

                <a href="{% url 'add_to_cart' item.product.id %}" class="btn btn-success btn-sm">
                    Add to Cart
                </a>

                <a href="{% url 'remove_from_wishlist' item.id %}" class="btn btn-danger btn-sm">
                    Remove
                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% else %}

<div class="alert alert-info text-center">

    <h4>Your wishlist is empty.</h4>

    <a href="/" class="btn btn-primary mt-3">
        Continue Shopping
    </a>

</div>

{% endif %}

{% endblock %}
